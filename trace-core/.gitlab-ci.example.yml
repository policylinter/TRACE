# Copy to .gitlab-ci.yml in your GitLab project. This file does not deploy anything.
stages: [security]
trace_sca:
  stage: security
  image: python:3.12-slim
  variables:
    OSV_VERSION: '2.7.0'
  before_script:
    - python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64', '/tmp/osv-scanner')"
    - python -c "import hashlib,pathlib; p=pathlib.Path('/tmp/osv-scanner'); assert hashlib.sha256(p.read_bytes()).hexdigest() == '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b'; p.chmod(0o755)"
  script:
    - python tools/run_sca_ci.py --scanner /tmp/osv-scanner --source . --output trace-sca --threshold high
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trace-sca/osv.json
      - trace-sca/gate.json
