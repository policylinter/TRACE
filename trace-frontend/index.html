<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme = 'light';
        try { theme = localStorage.getItem('trace.theme') === 'dark' ? 'dark' : 'light'; } catch {}
        document.documentElement.dataset.traceTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <meta
      name="description"
      content="TRACE — Transitive Reachability Analysis &amp; Contextual Exploitability. Local-first supply-chain security triage."
    />
